<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2026년 3월 리딩 프로그램</title>
<style>
:root{--ink:#182528;--muted:#657376;--deep:#075054;--teal:#117c80;--mint:#e8f6f5;--line:#d7e7e6;--bg:#f4faf9;--warn:#fff8ea}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Malgun Gothic","Segoe UI",Arial,sans-serif}button,input{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-rows:72px 1fr}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:0 22px;background:var(--deep);color:#fff}.brand{font-weight:900;font-size:18px;white-space:nowrap}.title{position:absolute;left:50%;transform:translateX(-50%);font-size:24px;font-weight:900;font-style:italic;white-space:nowrap}.top-actions{display:flex;align-items:center;gap:8px}.timer{min-width:72px;text-align:center;font-weight:900}.top-btn,.icon-btn{height:38px;border:1px solid rgba(255,255,255,.24);border-radius:6px;background:rgba(255,255,255,.1);color:#fff;font-weight:900}.top-btn{min-width:76px;padding:0 12px}.icon-btn{width:42px}.workspace{display:grid;grid-template-columns:300px minmax(420px,1fr) minmax(390px,48%);height:calc(100vh - 72px);min-height:0}.workspace.menu-mode{grid-template-columns:1fr}.workspace.menu-mode .side,.workspace.menu-mode .questions{display:none}.workspace.menu-mode .passage{border-right:0}.side{overflow:auto;border-right:1px solid var(--line);background:#f9fdfd;padding:18px}.set-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}.tab{min-height:46px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--deep);font-weight:900}.tab.active{background:var(--deep);color:#fff;border-color:var(--deep)}.search{width:100%;height:42px;border:1px solid var(--line);border-radius:7px;padding:0 12px;background:#fff;margin-bottom:12px}.list{display:grid;gap:8px}.reading-btn{width:100%;border:1px solid var(--line);border-radius:8px;background:#fff;padding:12px;text-align:left;color:var(--ink)}.reading-btn.active{border-color:var(--teal);background:var(--mint)}.reading-num{font-size:12px;color:var(--teal);font-weight:900}.reading-name{font-size:14px;font-weight:900;line-height:1.35;margin-top:4px}.reading-meta{font-size:12px;color:var(--muted);margin-top:5px}.passage,.questions{height:100%;min-height:0;overflow:auto;background:#fff}.passage{border-right:1px solid var(--line);padding:28px 34px 70px}.questions{padding:28px 34px 70px}.meta{display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--muted);font-size:14px;font-weight:800;margin-bottom:16px}.passage h1{margin:0 0 18px;color:var(--deep);font-size:26px;line-height:1.3}.passage-text{font-size:18px;line-height:1.78}.passage-text p{margin:0 0 20px}.question-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.question-head h2{margin:0;color:var(--deep);font-size:22px}.q-card{border-top:1px solid var(--line);padding:18px 0}.q-no{color:var(--teal);font-weight:900;font-size:14px;margin-bottom:8px}.q-stem{font-size:18px;font-weight:800;line-height:1.5;margin-bottom:12px}.choice{width:100%;min-height:48px;display:grid;grid-template-columns:34px 1fr;align-items:center;gap:10px;margin-top:9px;padding:10px 14px;border:1px solid var(--line);border-radius:7px;background:#fbfdfd;color:var(--ink);text-align:left}.choice:hover,.choice.selected{border-color:var(--teal);background:var(--mint)}.letter{width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:var(--mint);color:var(--deep);font-weight:900}.text-answer{width:100%;min-height:46px;border:1px solid var(--line);border-radius:7px;padding:9px 12px}.controls{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:18px}.action{min-height:42px;border:0;border-radius:6px;background:var(--teal);color:#fff;font-weight:900;padding:0 16px}.secondary{background:#edf5f4;color:var(--deep);border:1px solid var(--line)}.empty{height:100%;display:grid;place-items:center;text-align:center;padding:30px}.empty h2{color:var(--deep);font-size:30px;margin:0 0 12px}.empty p{margin:0 auto 22px;max-width:620px;color:var(--muted);line-height:1.7}.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:620px;margin:22px auto 0}.menu-card{min-height:116px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--deep);font-weight:900;text-align:left;padding:18px;box-shadow:0 8px 22px rgba(9,91,93,.06)}.menu-card span{display:block;margin-top:8px;color:var(--muted);font-size:14px;font-weight:700}.menu-card:hover{border-color:var(--teal);background:var(--mint)}.result-list{display:none;margin-top:16px;border:1px solid var(--line);border-radius:8px;padding:14px;background:#fbfdfd}.result-list.show{display:block}.result-row{padding:10px 0;border-top:1px solid var(--line);line-height:1.55}.result-row:first-child{border-top:0}.saved{color:var(--teal);font-weight:900}.no-choice{color:var(--muted);font-size:14px;line-height:1.6;margin-top:8px}.mode-pill{display:inline-flex;align-items:center;min-height:28px;padding:0 10px;border-radius:999px;background:var(--mint);color:var(--deep);font-size:13px;font-weight:900}@media(max-width:1100px){.title{display:none}.workspace{grid-template-columns:260px 1fr}.workspace.menu-mode{grid-template-columns:1fr}.questions{grid-column:2}.passage{border-right:0}.side{grid-row:1 / span 2}.questions,.passage{height:auto;min-height:50vh}}@media(max-width:760px){.app{display:block}.top{position:sticky;top:0;z-index:5;height:auto;min-height:66px;padding:10px 14px}.brand{font-size:15px}.top-actions{gap:6px}.top-btn{min-width:58px}.workspace{display:block;height:auto}.side,.passage,.questions{height:auto;border-right:0}.side{border-bottom:1px solid var(--line)}.passage{padding:22px;border-bottom:1px solid var(--line)}.workspace.menu-mode .passage{border-bottom:0}.questions{padding:22px}.passage-text{font-size:17px}.menu-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand">동성로YBM 스마트토플 김은지</div><div class="title">TOEFL iBT Reading</div><div class="top-actions"><button class="top-btn" id="prevReading">이전</button><button class="top-btn" id="nextReading">다음</button><button class="icon-btn" id="resetTimer" title="타이머 재시작">↻</button><div class="timer" id="timer">00:00</div></div></header>
<main class="workspace menu-mode" id="workspace">
<aside class="side"><div class="set-tabs" id="setTabs"></div><input class="search" id="search" placeholder="지문 검색"><div class="list" id="readingList"></div></aside>
<section class="passage"><div id="passagePane" class="empty"><div><div class="menu-grid"><button class="menu-card" id="startAcademic">학술주제 리딩<span>22개 지문</span></button><button class="menu-card" id="startLife">실생활 주제 리딩<span>27개 지문</span></button></div></div></div></section>
<section class="questions"><div id="questionPane" class="empty"><div><h2>문제 영역</h2><p>지문을 선택하면 문제가 이곳에 표시됩니다.</p></div></div></section>
</main>
</div>
<script src="data.js"></script>
<script>
const state={setId:"academic",readingIndex:0,started:false,seconds:0,timer:null};
const answers=JSON.parse(localStorage.getItem("readingProgramAnswers")||"{}");
const els={workspace:document.querySelector("#workspace"),tabs:document.querySelector("#setTabs"),search:document.querySelector("#search"),list:document.querySelector("#readingList"),passage:document.querySelector("#passagePane"),questions:document.querySelector("#questionPane"),prev:document.querySelector("#prevReading"),next:document.querySelector("#nextReading"),timer:document.querySelector("#timer"),reset:document.querySelector("#resetTimer"),startAcademic:document.querySelector("#startAcademic"),startLife:document.querySelector("#startLife")};
function currentSet(){return window.READING_DATA.sets.find((set)=>set.id===state.setId)}
function currentReading(){return currentSet().readings[state.readingIndex]}
function keyFor(q){return currentReading().id+"-q"+q.number}
function saveAnswers(){localStorage.setItem("readingProgramAnswers",JSON.stringify(answers))}
function escapeHtml(value){return String(value||"").replace(/[&<>"']/g,(m)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function renderTabs(){els.tabs.innerHTML="";window.READING_DATA.sets.forEach((set)=>{const button=document.createElement("button");button.className="tab"+(set.id===state.setId?" active":"");button.textContent=set.label;button.onclick=()=>{state.setId=set.id;state.readingIndex=0;state.started=true;resetTimer();renderAll()};els.tabs.append(button)})}
function renderList(){const set=currentSet();const query=els.search.value.trim().toLowerCase();els.list.innerHTML="";set.readings.filter((reading)=>(reading.title+" "+reading.number).toLowerCase().includes(query)).forEach((reading)=>{const realIndex=set.readings.indexOf(reading);const button=document.createElement("button");button.className="reading-btn"+(realIndex===state.readingIndex&&state.started?" active":"");button.innerHTML='<div class="reading-num">Reading '+reading.number+'</div><div class="reading-name">'+escapeHtml(reading.title)+'</div><div class="reading-meta">'+reading.questions.length+" questions</div>";button.onclick=()=>{state.readingIndex=realIndex;state.started=true;resetTimer();renderAll()};els.list.append(button)})}
function renderMain(){if(!state.started)return;const set=currentSet();const reading=currentReading();els.passage.className="";els.passage.innerHTML='<div class="meta"><span>'+set.label+"</span><span>Reading "+reading.number+"</span></div><h1>"+escapeHtml(reading.title)+'</h1><div class="passage-text">'+reading.passageHtml+"</div>";const answered=reading.questions.filter((question)=>answers[keyFor(question)]).length;els.questions.className="";els.questions.innerHTML='<div class="question-head"><h2>Questions</h2><span class="mode-pill">'+answered+" / "+reading.questions.length+' 저장됨</span></div><div id="qCards"></div><div class="controls"><button class="action secondary" id="clearReading">이 지문 답안 지우기</button><button class="action" id="showSaved">선택 답안 보기</button></div><div class="result-list" id="resultList"></div>';const wrap=document.querySelector("#qCards");reading.questions.forEach((question)=>wrap.append(renderQuestion(question)));document.querySelector("#clearReading").onclick=()=>{reading.questions.forEach((question)=>delete answers[keyFor(question)]);saveAnswers();renderAll()};document.querySelector("#showSaved").onclick=showSaved}
function renderQuestion(question){const div=document.createElement("div");div.className="q-card";div.innerHTML='<div class="q-no">Question '+question.number+'</div><div class="q-stem">'+escapeHtml(question.stem)+"</div>";if(question.choices&&question.choices.length){question.choices.forEach((choice)=>{const button=document.createElement("button");button.className="choice"+(answers[keyFor(question)]===choice.label?" selected":"");button.innerHTML='<span class="letter">'+choice.label+"</span><span>"+escapeHtml(choice.text)+"</span>";button.onclick=()=>{answers[keyFor(question)]=choice.label;saveAnswers();renderAll()};div.append(button)})}else{const input=document.createElement("input");input.className="text-answer";input.placeholder="답안을 입력하세요";input.value=answers[keyFor(question)]||"";input.oninput=()=>{answers[keyFor(question)]=input.value.trim();saveAnswers()};div.append(input);const note=document.createElement("div");note.className="no-choice";note.textContent="선택지가 PDF에서 분리되지 않은 문항입니다.";div.append(note)}return div}
function showSaved(){const reading=currentReading();const box=document.querySelector("#resultList");box.classList.toggle("show");box.innerHTML=reading.questions.map((question)=>'<div class="result-row"><strong>Q'+question.number+'</strong> <span class="saved">'+(answers[keyFor(question)]||"-")+"</span></div>").join("")}
function tick(){state.seconds=Math.max(0,state.seconds-1);const minutes=String(Math.floor(state.seconds/60)).padStart(2,"0");const seconds=String(state.seconds%60).padStart(2,"0");els.timer.textContent=minutes+":"+seconds;if(state.seconds===0)clearInterval(state.timer)}
function formatTime(totalSeconds){const minutes=String(Math.floor(totalSeconds/60)).padStart(2,"0");const seconds=String(totalSeconds%60).padStart(2,"0");return minutes+":"+seconds}
function resetTimer(){clearInterval(state.timer);state.seconds=state.started?currentReading().questions.length*60:0;els.timer.textContent=formatTime(state.seconds);if(state.started)state.timer=setInterval(tick,1000)}
function renderAll(){els.workspace.classList.toggle("menu-mode",!state.started);renderTabs();renderList();renderMain();els.prev.disabled=!state.started||state.readingIndex===0;els.next.disabled=!state.started||state.readingIndex>=currentSet().readings.length-1}
els.search.oninput=renderList;els.startAcademic.onclick=()=>{state.setId="academic";state.readingIndex=0;state.started=true;resetTimer();renderAll()};els.startLife.onclick=()=>{state.setId="life";state.readingIndex=0;state.started=true;resetTimer();renderAll()};els.prev.onclick=()=>{if(state.readingIndex>0){state.readingIndex--;resetTimer();renderAll()}};els.next.onclick=()=>{if(state.readingIndex<currentSet().readings.length-1){state.readingIndex++;resetTimer();renderAll()}};els.reset.onclick=resetTimer;renderAll();
</script>
</body>
</html>
